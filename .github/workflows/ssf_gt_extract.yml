name: SSF Live TMA Ground Truth Extract

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install requests
        run: python -m pip install --disable-pip-version-check requests

      - name: Download live BBWS TMA manual and telemetry data
        shell: bash
        run: |
          python - <<'PY'
          import csv
          import json
          import re
          import time
          from datetime import date, timedelta
          from pathlib import Path

          import requests

          output = Path("ssf_live_tma")
          raw_dir = output / "samples"
          raw_dir.mkdir(parents=True, exist_ok=True)

          session = requests.Session()
          session.headers.update({
              "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126 Safari/537.36",
              "Accept": "application/json,text/plain,*/*",
              "Referer": "https://update.bbws-bsolo.net/tma",
              "X-Requested-With": "XMLHttpRequest",
          })

          start = date(2025, 1, 1)
          end = date(2026, 5, 18)
          endpoint = "https://update.bbws-bsolo.net/tma/tma/{date}"

          def parse_number(value):
              if value is None:
                  return ""
              text = str(value).strip()
              if not text or text == "-" or "tidak ada" in text.lower():
                  return ""
              match = re.search(r"[-+]?\d+(?:[.,]\d+)?", text)
              if not match:
                  return ""
              return match.group(0).replace(",", ".")

          def first_item(value):
              if isinstance(value, list) and value:
                  return value[0] if isinstance(value[0], dict) else {}
              return value if isinstance(value, dict) else {}

          rows = []
          status_rows = []
          current = start
          total_days = (end - start).days + 1

          while current <= end:
              ds = current.isoformat()
              url = endpoint.format(date=ds)
              response = None
              error = None
              for attempt in range(4):
                  try:
                      response = session.get(url, timeout=45)
                      if response.status_code == 200:
                          break
                      error = f"HTTP {response.status_code}"
                  except Exception as exc:
                      error = repr(exc)
                  time.sleep(1.5 * (attempt + 1))

              if response is None or response.status_code != 200:
                  status_rows.append({"date": ds, "status": getattr(response, "status_code", ""), "records": 0, "error": error or "no response"})
                  current += timedelta(days=1)
                  continue

              body = response.text.strip()
              if ds in {"2025-01-01", "2025-09-18", "2025-09-19", "2025-12-31", "2026-01-01", "2026-05-18"}:
                  (raw_dir / f"{ds}.txt").write_text(body, encoding="utf-8")

              try:
                  payload = response.json()
                  if isinstance(payload, str):
                      payload = json.loads(payload)
              except Exception:
                  try:
                      payload = json.loads(body)
                  except Exception as exc:
                      status_rows.append({"date": ds, "status": response.status_code, "records": 0, "error": f"JSON parse: {exc!r}"})
                      current += timedelta(days=1)
                      continue

              if isinstance(payload, dict):
                  for key in ("data", "result", "rows"):
                      if isinstance(payload.get(key), list):
                          payload = payload[key]
                          break

              if not isinstance(payload, list):
                  status_rows.append({"date": ds, "status": response.status_code, "records": 0, "error": f"unexpected payload {type(payload).__name__}"})
                  current += timedelta(days=1)
                  continue

              for station in payload:
                  if not isinstance(station, dict):
                      continue
                  pos = station.get("pos") or {}
                  manual = station.get("manual") or {}
                  pagi = first_item(station.get("pagi"))
                  siang = first_item(station.get("siang"))
                  sore = first_item(station.get("sore"))
                  rows.append({
                      "date": ds,
                      "station_id": pos.get("id", pos.get("pos_id", "")),
                      "station_name": pos.get("nama", ""),
                      "river": pos.get("sungai", ""),
                      "manual_06": parse_number(manual.get("enam")),
                      "manual_12": parse_number(manual.get("duabelas")),
                      "manual_18": parse_number(manual.get("delapanbelas")),
                      "manual_wlevel_06": parse_number(manual.get("wlevel_enam")),
                      "manual_wlevel_12": parse_number(manual.get("wlevel_duabelas")),
                      "manual_wlevel_18": parse_number(manual.get("wlevel_delapanbelas")),
                      "manual_status_06": manual.get("status_enam", ""),
                      "manual_status_12": manual.get("status_duabelas", ""),
                      "manual_status_18": manual.get("status_delapanbelas", ""),
                      "telemetry_06": parse_number(pagi.get("wlevel_mdpl")),
                      "telemetry_12": parse_number(siang.get("wlevel_mdpl")),
                      "telemetry_18": parse_number(sore.get("wlevel_mdpl")),
                      "telemetry_time_06": pagi.get("waktu", ""),
                      "telemetry_time_12": siang.get("waktu", ""),
                      "telemetry_time_18": sore.get("waktu", ""),
                  })

              status_rows.append({"date": ds, "status": response.status_code, "records": len(payload), "error": ""})
              processed = (current - start).days + 1
              if processed % 25 == 0 or current == end:
                  print(f"{processed}/{total_days} days; rows={len(rows)}")
              current += timedelta(days=1)
              time.sleep(0.05)

          fields = [
              "date", "station_id", "station_name", "river",
              "manual_06", "manual_12", "manual_18",
              "manual_wlevel_06", "manual_wlevel_12", "manual_wlevel_18",
              "manual_status_06", "manual_status_12", "manual_status_18",
              "telemetry_06", "telemetry_12", "telemetry_18",
              "telemetry_time_06", "telemetry_time_12", "telemetry_time_18",
          ]
          with (output / "live_tma_2025_2026.csv").open("w", newline="", encoding="utf-8") as f:
              writer = csv.DictWriter(f, fieldnames=fields)
              writer.writeheader()
              writer.writerows(rows)

          with (output / "request_status.csv").open("w", newline="", encoding="utf-8") as f:
              writer = csv.DictWriter(f, fieldnames=["date", "status", "records", "error"])
              writer.writeheader()
              writer.writerows(status_rows)

          successful = [r for r in status_rows if r["records"]]
          summary = {
              "endpoint_template": endpoint,
              "requested_start": start.isoformat(),
              "requested_end": end.isoformat(),
              "requested_days": total_days,
              "successful_days": len(successful),
              "failed_or_empty_days": total_days - len(successful),
              "station_day_rows": len(rows),
              "first_success": successful[0]["date"] if successful else None,
              "last_success": successful[-1]["date"] if successful else None,
              "unique_station_names": sorted({r["station_name"] for r in rows}),
          }
          (output / "summary.json").write_text(json.dumps(summary, indent=2, ensure_ascii=False), encoding="utf-8")
          print(json.dumps(summary, indent=2, ensure_ascii=False))
          PY

      - name: Upload live TMA extraction
        uses: actions/upload-artifact@v4
        with:
          name: ssf-live-tma-2025-2026
          path: ssf_live_tma/
          if-no-files-found: error
          retention-days: 1
