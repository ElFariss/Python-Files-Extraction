name: SSF GT Live Endpoint Probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install lightweight HTML tooling
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Download BBWS pages and discover data endpoints
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import re
          from pathlib import Path
          from urllib.parse import urljoin, urlparse

          import requests
          from bs4 import BeautifulSoup

          out = Path("ssf_live_probe")
          pages_dir = out / "pages"
          assets_dir = out / "assets"
          pages_dir.mkdir(parents=True, exist_ok=True)
          assets_dir.mkdir(parents=True, exist_ok=True)

          session = requests.Session()
          session.headers.update({
              "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126 Safari/537.36",
              "Accept": "text/html,application/xhtml+xml,application/json;q=0.9,*/*;q=0.8",
          })

          targets = {
              "current_tma": "https://update.bbws-bsolo.net/tma",
              "current_root": "https://update.bbws-bsolo.net/",
              "old_tma_hidden_date": "https://hidrologi.bbws-bsolo.net/tma/?d=19+Sep+25",
              "old_tma_iso_date": "https://hidrologi.bbws-bsolo.net/tma/?d=2025-09-19",
              "old_tma_root": "https://hidrologi.bbws-bsolo.net/tma/",
              "old_manual_station_2": "https://hidrologi.bbws-bsolo.net/adm/manual/addData/2",
              "old_station_2": "https://hidrologi.bbws-bsolo.net/tma/infodetailpos/2",
              "sih3_data": "https://sih3.bbwsbs.id/data",
              "sih3_hydrology": "https://sih3.bbwsbs.id/pengamatan/hidrologi",
          }

          summary = {}
          asset_urls = set()
          forms = []

          def safe_name(text):
              return re.sub(r"[^A-Za-z0-9._-]+", "_", text).strip("_")[:120]

          for name, url in targets.items():
              try:
                  response = session.get(url, timeout=30, allow_redirects=True)
                  body = response.content
                  ext = ".json" if "json" in response.headers.get("content-type", "") else ".html"
                  path = pages_dir / f"{name}{ext}"
                  path.write_bytes(body)
                  summary[name] = {
                      "requested_url": url,
                      "final_url": response.url,
                      "status": response.status_code,
                      "content_type": response.headers.get("content-type"),
                      "bytes": len(body),
                      "headers": dict(response.headers),
                  }

                  if "html" in response.headers.get("content-type", "") or ext == ".html":
                      soup = BeautifulSoup(response.text, "html.parser")
                      for tag in soup.find_all(["script", "link"]):
                          ref = tag.get("src") or tag.get("href")
                          if not ref:
                              continue
                          absolute = urljoin(response.url, ref)
                          low = absolute.lower().split("?", 1)[0]
                          if low.endswith((".js", ".mjs")) or "/build/assets/" in low or "/assets/" in low:
                              asset_urls.add(absolute)
                      for form in soup.find_all("form"):
                          forms.append({
                              "page": name,
                              "action": urljoin(response.url, form.get("action") or ""),
                              "method": (form.get("method") or "get").lower(),
                              "id": form.get("id"),
                              "class": form.get("class"),
                              "inputs": [
                                  {
                                      "name": el.get("name"),
                                      "id": el.get("id"),
                                      "type": el.get("type"),
                                      "value": el.get("value"),
                                  }
                                  for el in form.find_all(["input", "select", "button"])
                              ],
                          })
              except Exception as exc:
                  summary[name] = {"requested_url": url, "error": repr(exc)}

          downloaded_assets = []
          for index, url in enumerate(sorted(asset_urls)):
              try:
                  response = session.get(url, timeout=30, allow_redirects=True)
                  digest = hashlib.sha1(url.encode()).hexdigest()[:10]
                  parsed = urlparse(response.url)
                  base = safe_name(Path(parsed.path).name or f"asset_{index}")
                  filename = f"{index:03d}_{digest}_{base}"
                  path = assets_dir / filename
                  path.write_bytes(response.content)
                  downloaded_assets.append({
                      "requested_url": url,
                      "final_url": response.url,
                      "status": response.status_code,
                      "content_type": response.headers.get("content-type"),
                      "bytes": len(response.content),
                      "file": str(path),
                  })
              except Exception as exc:
                  downloaded_assets.append({"requested_url": url, "error": repr(exc)})

          patterns = re.compile(
              r"(?i)(https?://[^\"'<> ]+|[/][A-Za-z0-9_./?=&{}:+-]*(?:api|ajax|tma|manual|hidrologi|backend|data)[A-Za-z0-9_./?=&{}:+-]*)"
          )
          keywords = re.compile(r"(?i)(fetch\s*\(|axios|ajax|api|tma|manual|backend|base_url|tanggal|datetime|date)")
          findings = []

          for root in [pages_dir, assets_dir]:
              for path in root.rglob("*"):
                  if not path.is_file() or path.stat().st_size > 20_000_000:
                      continue
                  text = path.read_text(encoding="utf-8", errors="ignore")
                  for match in patterns.finditer(text):
                      start = max(0, match.start() - 180)
                      end = min(len(text), match.end() + 260)
                      snippet = text[start:end].replace("\n", " ")
                      if keywords.search(snippet):
                          findings.append({"file": str(path), "match": match.group(0), "context": snippet})

          # Deduplicate while retaining useful context.
          deduped = []
          seen = set()
          for item in findings:
              key = (item["file"], item["match"])
              if key in seen:
                  continue
              seen.add(key)
              deduped.append(item)

          (out / "summary.json").write_text(json.dumps(summary, indent=2), encoding="utf-8")
          (out / "forms.json").write_text(json.dumps(forms, indent=2), encoding="utf-8")
          (out / "assets.json").write_text(json.dumps(downloaded_assets, indent=2), encoding="utf-8")
          (out / "endpoint_findings.json").write_text(json.dumps(deduped[:5000], indent=2), encoding="utf-8")
          (out / "endpoint_findings.txt").write_text(
              "\n\n".join(
                  f"FILE: {item['file']}\nMATCH: {item['match']}\nCONTEXT: {item['context']}"
                  for item in deduped[:5000]
              ),
              encoding="utf-8",
          )
          print(json.dumps({
              "pages": len(summary),
              "asset_urls": len(asset_urls),
              "assets_downloaded": sum("file" in x for x in downloaded_assets),
              "forms": len(forms),
              "findings": len(deduped),
          }, indent=2))
          PY

      - name: Upload live endpoint probe
        uses: actions/upload-artifact@v4
        with:
          name: ssf-gt-live-endpoint-probe
          path: ssf_live_probe/
          if-no-files-found: error
          retention-days: 1
